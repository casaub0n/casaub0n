# https://turborepo.org/docs/ci/github-actions
# https://kotaro7750.hatenablog.com/entry/dotfile_ci
# https://qiita.com/nacam403/items/3e2a5df5e88ba20aa76a
name: workflow monorepo with turbo cache
on:
  push:
    paths-ignore:
      - "**.md"
      - "crates/**"

jobs:
  dotfiles:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        script:
          [
            "./packages/dotfiles/init/linux/scripts/zsh.sh",
            "./packages/dotfiles/init/linux/scripts/tmux.sh",
          ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install dotfiles
        run: ${{matrix.script}}

  Run-pnpm:
    name: Run pnpm on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    env:
      CI: true
      TURBO_TOKEN: ${{ secrets.USERSCRIPT_TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.USERSCRIPT_TURBO_TEAM }}
    strategy:
      matrix:
        tasks:
          [
            "build",
            "test:ci",
            "lint --filter=@casaub0n/test-driven-development-by-example --filter=next-casaub0n --filter=@casaub0n/ui --filter=@casaub0n/casaub0n-astro",
            "type:check",
          ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Don't specific actual pnpm's version because renovate can't update pnpm's version, this action read pnpm version of root's package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Create dot env file
        shell: bash
        run: |
          touch .env.ci
          echo "CHROME=$(which google-chrome)"
          echo "CHROME=$(which google-chrome)" >> .env.ci

      - name: Install dependencies
        run: pnpm install

      - name: pnpm tasks
        run: pnpm ${{ matrix.tasks }}
